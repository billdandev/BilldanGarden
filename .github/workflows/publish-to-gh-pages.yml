name: Build and publish to gh pages

on:
  push:
    branches: ["main"]
env:
  ASPNETCORE_ENVIRONMENT: Production
  WEBAPP_PATH: ./
  WEBAPP_CSPROJ: BilldanGarden.csproj

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Remove launchSettings.json (to not override ASPNETCORE_ENVIRONMENT)
        run: rm  ${{ env.WEBAPP_PATH }}Properties/launchSettings.json

      - run: mkdir -p "${{ env.WEBAPP_PATH }}wwwroot" && touch "${{ env.WEBAPP_PATH }}wwwroot/.nojekyll"
      - name: Run webapp and generate static files
        run: |
          dotnet run --project ${{ env.WEBAPP_PATH }}${{env.WEBAPP_CSPROJ}}  --configuration Release

      - name: Create sitemap.xml
        run: |
          cat > output/sitemap.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.w3.org/2000/09/xmlns">
            <url><loc>https://billdandev.github.io/BilldanGarden/</loc></url>
            <url><loc>https://billdandev.github.io/BilldanGarden/blog/first-post</loc></url>
            <url><loc>https://billdandev.github.io/BilldanGarden/blog/second-post</loc></url>
            <url><loc>https://billdandev.github.io/BilldanGarden/tags/tag-001</loc></url>
            <url><loc>https://billdandev.github.io/BilldanGarden/tags/another-sample-tag</loc></url>
          </urlset>
          EOF

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ${{ env.WEBAPP_PATH }}output
